[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/old*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark`, `dbutils` and `display` are injected by the runtime and
# are undefined at lint time (F821); cells run top-to-bottom so imports are not always at
# module top (E402). These directories hold notebooks, not importable modules.
# src/fleetguard/ is deliberately NOT exempted — it is plain Python and stays strict.
"src/ingest/*.py"   = ["F821", "E402", "F401", "F841"]
"src/fleet/*.py"    = ["F821", "E402", "F401", "F841"]
"src/backtest/*.py" = ["F821", "E402", "F401", "F841"]
"src/lakebase/*.py" = ["F821", "E402", "F401", "F841"]
"src/search/*.py"   = ["F821", "E402", "F401", "F841"]
"src/setup/*.py"    = ["F821", "E402", "F401", "F841"]
"src/agent/*.py"    = ["F821", "E402", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app/backend"]
addopts = "-q --strict-markers"
markers = [
    "integration: hits the live Databricks workspace; skipped unless --run-integration",
]
