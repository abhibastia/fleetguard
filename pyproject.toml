[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/old*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks use magic comment cells and top-level display() calls
"**/notebooks/**" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
