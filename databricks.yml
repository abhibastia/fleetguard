# FleetGuard — Declarative Automation Bundle root.
#
# Full history (why this exists, what it replaced, the drift it fixed) is
# docs/ARCHITECTURE.md §9.1. What it does NOT cover — Lakebase CDF, the AI Search
# endpoint/index, the agent serving endpoint, both metric views — is the same section,
# "five exceptions", so a green `bundle deploy` is never read as "environment complete".
#
# SAFETY RULE: never run `bundle generate` with its default `--source-dir` — it downloads
# the *workspace* copy of every notebook and would overwrite `src/` with the stale content
# this bundle exists to eliminate. Redirect `--source-dir` to a scratch path.

bundle:
  name: fleetguard

include:
  - resources/*.yml

# Only src/, app/backend/ and dashboards/ are needed in the workspace; everything else here
# is repo furniture that would otherwise be uploaded on every deploy for no reason.
sync:
  exclude:
    - docs/
    - tests/
    - scripts/
    - app/frontend/
    - .github/
    - .claude/
    - .idea/

variables:
  catalog:
    description: Unity Catalog catalog holding every FleetGuard object.
    default: bootcamp_students
  schema:
    description: >-
      The project's one schema. Catalog creation is not available on this workspace, so
      medallion layers are table-name prefixes (bronze_/silver_/gold_), not sibling schemas.
    default: fleetguard
  warehouse_id:
    description: Serverless Starter Warehouse — the dashboard's warehouse.
    default: b15d3d6f837ba428
  llm_endpoint:
    description: Foundation-model serving endpoint the agent calls.
    default: databricks-claude-opus-4-8
  lakebase_project:
    description: Lakebase project id holding the FleetGuard Postgres schema.
    default: projects/summer-bootcamp-2026-v2
  pg_schema:
    description: Postgres schema (inside the Lakebase project) holding the FleetGuard tables.
    default: bootcamp_students
  pg_database:
    description: Postgres database name inside the Lakebase project.
    default: databricks_postgres
  agent_endpoint:
    description: >-
      Model-serving endpoint name Databricks derives for the deployed agent
      (agents_<catalog>-<schema>-<model>). Not auto-computed by the bundle — each target
      restates it to match its own catalog/schema.
    default: agents_bootcamp_students-fleetguard-fleetguard_agent
  scale_to_zero:
    description: >-
      Passed to agents.deploy(). Free Edition requires it (InvalidParameterValue otherwise,
      measured 2026-09-25); abhi's default (false) is prod's existing, unchanged behavior.
    default: "false"

# No `lookup:` variables and `run_as` is pinned rather than ${workspace.current_user} — fewer
# moving parts, one obvious owner. Neither makes `bundle validate` run without credentials
# (measured: it still needs them); the offline checks live in tests/test_bundle_resources.py.

targets:
  # One target, deliberately: `mode: development` name-prefixes every resource into a
  # namespace shared with ~296 other students (jobs list already has name collisions), and
  # it pauses schedules/triggers — which would silently stop fleetguard-cdf-to-gold.
  prod:
    default: true
    mode: production
    workspace:
      host: https://dbc-7b106152-caf3.cloud.databricks.com
      root_path: /Workspace/Users/abhisek.bastia17@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: abhisek.bastia17@gmail.com
    # Per-target, not a base list in fleetguard_console.app.yml: a target-level override on a
    # list field appends rather than replaces, so an empty base list is what makes this a
    # clean per-target ACL instead of an accumulating one.
    resources:
      apps:
        fleetguard_console:
          permissions:
            - level: CAN_MANAGE
              user_name: abhisek.bastia17@gmail.com
            - level: CAN_MANAGE
              user_name: raghavendra.yama@gmail.com
            - level: CAN_MANAGE
              user_name: sangwanrahul@icloud.com
            - level: CAN_MANAGE
              user_name: zach@zachwilson.tech
      dashboards:
        fleetguard_overview:
          permissions:
            - level: CAN_MANAGE
              user_name: abhisek.bastia17@gmail.com
            - level: CAN_RUN
              user_name: raghavendra.yama@gmail.com
            - level: CAN_RUN
              user_name: sangwanrahul@icloud.com
            - level: CAN_RUN
              user_name: zach@zachwilson.tech
      jobs:
        # The real CDF->gold trigger, prod-only — resources/cdf_to_gold.job.yml carries the
        # job's non-trigger fields.
        cdf_to_gold:
          trigger:
            pause_status: UNPAUSED
            table_update:
              condition: ANY_UPDATED
              min_time_between_triggers_seconds: 60
              table_names:
                - bootcamp_students.bootcamp_cdc.lb_fleetguard_agent_action_history
                - bootcamp_students.bootcamp_cdc.lb_fleetguard_defect_signal_history
              wait_after_last_change_seconds: 61

  # Second target — Databricks Free Edition (abhibastia90@gmail.com), a wholly separate
  # account/workspace/metastore used only for isolated agent/app testing, never the submission
  # deliverable (that stays prod/abhi). fleetguard-cdf-to-gold exists here too — DABs cannot
  # exclude a resource per-target — but gets no trigger override, so it sits inert.
  free_edition:
    mode: production
    workspace:
      host: https://dbc-6b3a5534-db75.cloud.databricks.com
      root_path: /Workspace/Users/abhibastia90@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: abhibastia90@gmail.com
    variables:
      catalog: fleetguard
      schema: capstone
      warehouse_id: 6797e114217fa513
      # databricks-claude-opus-4-8 (prod's model) 404s on this account; gpt-oss-120b is the
      # largest reasoning-capable model Free Edition offers (measured 2026-09-25).
      llm_endpoint: databricks-gpt-oss-120b
      lakebase_project: projects/fleetguard-free-edition
      # `public`, not bootcamp_students' pattern: this project has no pre-existing `fleetguard`
      # schema, and Postgres's default schema needs no extra creation step.
      pg_schema: public
      pg_database: databricks_postgres
      agent_endpoint: agents_fleetguard-capstone-fleetguard_agent
      scale_to_zero: "true"
    resources:
      apps:
        fleetguard_console:
          permissions:
            - level: CAN_MANAGE
              user_name: abhibastia90@gmail.com
          # Do not replace with a `config:` block: it validates and deploys clean but
          # silently fails to write app.yaml into the workspace (databricks/cli#4901,
          # confirmed on v1.12.1). source_code_path below is a separate directory carrying
          # its own real app.yaml (scripts/sync_free_edition_app.sh keeps it in sync).
          source_code_path: ./app/backend_free_edition
      dashboards:
        fleetguard_overview:
          parent_path: /Users/abhibastia90@gmail.com/dashboards
          # fleetguard_overview_free_edition.lvdash.json repoints the two metric-view widgets
          # at fleetguard.capstone (the catalog/schema vars above don't reach a dataset's
          # literal `asset_name`). evidence_metrics' equivalent isn't reproduced here — its
          # source table predates this bundle's scope — so that one widget degrades alone
          # rather than blocking the page.
          file_path: ./dashboards/fleetguard_overview_free_edition.lvdash.json
          permissions:
            - level: CAN_MANAGE
              user_name: abhibastia90@gmail.com
