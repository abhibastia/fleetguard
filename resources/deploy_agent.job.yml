# Deploy the agent to its serving endpoint.
#
# No `model_version` in `base_parameters` — same reasoning as `evaluate_agent.job.yml`'s
# (I-098): a base parameter would pin the widget and could redeploy an old version over a
# newer one that's live. `15_deploy_agent.py` resolves the latest registered version itself
# when the widget is blank. `catalog`/`schema` ARE passed — unrelated to model selection,
# just needed so this job targets the right MODEL_NAME per bundle target.

resources:
  jobs:
    deploy_agent:
      name: fleetguard-deploy-agent
      tasks:
        - task_key: deploy
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/agent/15_deploy_agent.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              scale_to_zero: ${var.scale_to_zero}
          run_if: ALL_SUCCESS
          timeout_seconds: 5400
      email_notifications: {}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
