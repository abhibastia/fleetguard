# Postgres -> gold facts, on a `table_update` trigger.
#
# Both trigger intervals have a hard 60s platform floor (`jobs create` rejects anything
# smaller, I-081) — this is why the chain is ~2.5-4.5 min end to end, not sub-minute; the
# sub-minute figure (7.1-15.6s, I-046) is CDF replication alone, never the whole chain.
# `ANY_UPDATED`, not `ALL_UPDATED`: the batch signals loader writes fleetguard_defect_signal
# with no matching fleetguard_agent_action write, so ALL_UPDATED would wait forever.
#
# The trigger itself lives only under `targets.prod` in databricks.yml, NOT here — DABs has
# no per-target resource exclusion, and `table_update`'s table_names are validated against
# real UC tables at CREATE time, which free_edition's CDF-less setup doesn't have. Giving
# free_edition no `trigger:` override leaves this job created but inert there (manual-run
# only) — see databricks.yml's `targets.prod.resources.jobs.cdf_to_gold` for the real trigger.

resources:
  jobs:
    cdf_to_gold:
      name: fleetguard-cdf-to-gold
      tasks:
        - task_key: derive_facts
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/lakebase/21_cdf_to_gold_facts.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 3600
      email_notifications: {}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
