# Lakeflow Declarative Pipeline: NHTSA flat files -> bronze_* -> silver_*.
#
# Two things the SQL depends on that aren't visible here, so nobody "simplifies" them away:
# every `read_files` call needs `quote => '\0'` (the ODI files are tab-delimited with no
# quoting convention but narratives contain `"`; `_rescued_data` stays 0 even when rows parse
# wrong — see CLAUDE.md); the volume layout is per-source subdirectories because Auto Loader
# monitors directories, not files.
#
# `development` is deliberately unset — `mode: production` resolves it to false (the live
# pipeline had been `development: true`), which changes cluster reuse/retry behaviour, not
# results, for this serverless/triggered pipeline.

resources:
  pipelines:
    bronze_silver:
      name: fleetguard-bronze-silver
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      # Bundle variables don't reach SQL text directly; `configuration:` values do via
      # `${key}` interpolation, so the volume root is composed here and referenced as
      # `${nhtsa_volume_root}` in each bronze_*.sql file instead of a hardcoded literal.
      configuration:
        nhtsa_volume_root: /Volumes/${var.catalog}/${var.schema}/nhtsa_flat_files
      lifecycle:
        prevent_destroy: true  # deleting this drops bronze/silver (2.24M + 5.8M rows); hours to reload
      libraries:
        - glob:
            include: ../src/pipelines/**
