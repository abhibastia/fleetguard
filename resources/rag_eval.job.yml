# RAG retrieval evaluation — the measurement, not the wiring. Only produces numbers while
# `complaint_chunk_idx` is live (a costed window), so it's bound here but runs alongside the
# index rebuild it depends on.
#
# `catalog`/`schema` are passed as base_parameters rather than hardcoded, so the notebook
# reads whichever target's tables the job was deployed against. `seed` stays a module
# constant, not a parameter — a different seed is a different evaluation, not a repeat.
# Timeout is 1h: 200 index queries plus three behavioural checks; if it approaches that, the
# index is the problem, not the notebook.

resources:
  jobs:
    rag_eval:
      name: fleetguard-rag-eval
      tasks:
        - task_key: evaluate_retrieval
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/search/28_rag_eval.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          run_if: ALL_SUCCESS
          timeout_seconds: 3600
      email_notifications: {}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
