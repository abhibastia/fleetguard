resources:
  jobs:
    build_fleet_exposure:
      name: fleetguard-build-fleet-exposure
      tasks:
        - task_key: exposure
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/fleet/04b_build_fleet_exposure.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications: {}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
