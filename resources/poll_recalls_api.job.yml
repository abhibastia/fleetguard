# Live recall polling against api.nhtsa.gov/recalls/recallsByVehicle.
#
# `max_retries: 2` retries the whole task (a minute apart; safe to re-run — bronze write is
# an append, poll-state write is a MERGE), on top of the notebook's own per-combo retries.
# `failure_gate_pct`: above that share of failed combos the notebook refuses to rebuild
# `gold_recall_alert` and raises — set to -1 to deliberately trip the gate, 10 otherwise.
#
# No schedule, deliberately: this is a ~200-request sweep against a public government API,
# and a short cadence would mean tens of thousands of requests/day to demonstrate a latency
# number the notebook's own worst-case table already documents. Run on demand.

resources:
  jobs:
    poll_recalls_api:
      name: fleetguard-poll-recalls-api
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: max_combos
          default: "0"
        - name: failure_gate_pct
          default: "10"
      tasks:
        - task_key: poll
          disabled: false
          email_notifications: {}
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/ingest/05_poll_recalls_api.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications: {}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
