resources:
  jobs:
    poll_recalls_api:
      name: fleetguard-poll-recalls-api
      tasks:
        - task_key: poll
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/ingest/05_poll_recalls_api.py
