resources:
  jobs:
    enable_depot_rls:
      name: fleetguard-enable-depot-rls
      tasks:
        - task_key: rls
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/15_enable_depot_rls.py
            source: WORKSPACE
            base_parameters:
              lakebase_project: ${var.lakebase_project}
              pg_schema: ${var.pg_schema}
              pg_database: ${var.pg_database}
          run_if: ALL_SUCCESS
          timeout_seconds: 1800
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
