# Agent evaluation.
#
# No `model_version` in `base_parameters`, deliberately: a base parameter sets the notebook's
# widget, which defeats its own "blank widget = latest registered version" logic and can
# silently score a stale model while a newer one serves (I-098). Pin a version here only to
# evaluate a specific old artefact on purpose, and remove it again afterwards.

resources:
  jobs:
    evaluate_agent:
      name: fleetguard-evaluate-agent
      tasks:
        - task_key: evaluate
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/agent/16_evaluate_agent.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          run_if: ALL_SUCCESS
          timeout_seconds: 10800
      email_notifications: {}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
