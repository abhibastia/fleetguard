# Creates fleetguard_watchlist — what the agent's watch_campaign action and
# routers/watchlist.py both depend on.
#
# ADDED TO THE BUNDLE 2026-09-17 (full-repo review finding, HIGH): never wired to any job, so
# a rebuild from empty had no runnable step for a table the app already depends on in
# production. Idempotent (`CREATE TABLE IF NOT EXISTS`).
#
# The `environments` block is load-bearing: for serverless jobs the dependency list lives in
# the job, not the notebook.

resources:
  jobs:
    create_watchlist_table:
      name: fleetguard-create-watchlist-table
      tasks:
        - task_key: create_watchlist
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/22_create_watchlist_table.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
