# Creates the other ten Lakebase tables (fleetguard_depot was proved first, I-038).
#
# On the rebuild-from-empty path like everything else the bundle owns — it was excluded for a
# while as "a patch", which left it running a hand-synced workspace copy that drifted behind
# `main` and lost the `PSYCOPG_IMPL=python` fix (I-045) silently. Bound here instead.
#
# The `environments` block is load-bearing: for serverless jobs the dependency list lives in
# the job, not the notebook.

resources:
  jobs:
    create_remaining_tables:
      name: fleetguard-create-remaining-tables
      tasks:
        - task_key: create_tables
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/08_create_remaining_tables.py
            source: WORKSPACE
            base_parameters:
              lakebase_project: ${var.lakebase_project}
              pg_schema: ${var.pg_schema}
              pg_database: ${var.pg_database}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
