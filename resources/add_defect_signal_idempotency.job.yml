# Creates ux_fg_defect_signal_agent_active — one OPEN agent signal per (actor, series,
# component), so a retried or double-clicked `open_defect_signal` cannot write the same
# observation twice (I-110 #6, from the second external repo review).
#
# Bound like every other schema migration on this table: `create_remaining_tables` makes
# `fleetguard_defect_signal`, `add_defect_signal_provenance` adds its source/opened_by
# columns, and this adds its uniqueness rule — so a rebuild from empty has a runnable step
# for each. An unbound migration is a constraint that exists only in whoever ran it once
# (the mistake corrected for `create_remaining_tables` on 2026-09-11).
#
# Idempotent: `CREATE UNIQUE INDEX IF NOT EXISTS`, and the notebook's proofs all run inside
# savepoints that are rolled back.
#
# The `environments` block is load-bearing: for serverless jobs the dependency list lives in
# the job, not the notebook.

resources:
  jobs:
    add_defect_signal_idempotency:
      name: fleetguard-add-defect-signal-idempotency
      tasks:
        - task_key: add_idempotency_index
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/26_add_defect_signal_idempotency.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
