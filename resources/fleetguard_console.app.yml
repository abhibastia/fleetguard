# Databricks App: the FleetGuard operations console.
#
# OBO scopes are declared here, not in app.yaml's `user_authorization:` block — that form is
# silently ignored and every Lakebase route 403s (I-083). Must be re-granted after any change
# AND the app restarted (identical 403 either way, I-086); each user's consent is also sticky
# and does not widen on its own — see docs/ARCHITECTURE.md §8a for the full consent-fix path.
#
#   postgres       -> generate_database_credential + get_endpoint (every Lakebase read/write)
#   sql            -> SQL warehouse, for the routes that query UC rather than Postgres
#   model-serving  -> POST /serving-endpoints/.../invocations, from the chat panel
#   vector-search  -> get_index, for /api/readyz's index check (I-123)
#
# No `config:` block: it would override app/backend/app.yaml's own env-var documentation,
# creating two sources of truth for runtime config. This file owns identity/scopes/permissions
# only. No `resources:` block either: the App holds no privileges of its own (every Lakebase
# and serving-endpoint call runs under the caller's forwarded token, never the app's).

resources:
  apps:
    fleetguard_console:
      name: fleetguard-console
      description: FleetGuard operations console — FastAPI serving /api/* and the built React SPA from one process.
      # React console under fleetguard_api/console/ is COMMITTED, not built here (Apps has no
      # Node). Re-run ./scripts/build_console.sh after any app/frontend/ change.
      source_code_path: ../app/backend

      user_api_scopes:
        - postgres
        - sql
        - model-serving
        - vector-search

      lifecycle:
        prevent_destroy: true  # bundle destroy would take the demo with it

      # Deliberately no base `permissions:` list — each target in databricks.yml supplies its
      # own ACL. A target-level override on a list field APPENDS rather than replaces, so an
      # empty base list is what makes a per-target ACL work instead of accumulating across
      # targets (prod's abhi-cohort emails aren't valid principals in free_edition).
      # `${var.x}` substitution for this whole list was tried and rejected by this CLI version
      # ("cannot interpolate non-primitive value of type sequence into string") — don't retry
      # without checking a newer CLI first.
