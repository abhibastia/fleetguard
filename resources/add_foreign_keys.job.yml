# Referential integrity for the Lakebase schema — relationships that were app-checked but
# never database-enforced, plus supporting indexes on FK child columns. Also repairs I-107
# (`fleetguard_depot_assignment` missing `REPLICA IDENTITY FULL`, so no CDF history table).
#
# Idempotent: Postgres has no `ADD CONSTRAINT ... IF NOT EXISTS`, so the notebook checks
# `pg_constraint` itself before adding each one. A re-run is a no-op that still re-proves
# enforcement.
#
# The `environments` block is load-bearing: for serverless jobs the dependency list lives
# in the job, not the notebook.

resources:
  jobs:
    add_foreign_keys:
      name: fleetguard-add-foreign-keys
      tasks:
        - task_key: add_foreign_keys
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/24_add_foreign_keys.py
            source: WORKSPACE
            base_parameters:
              lakebase_project: ${var.lakebase_project}
              pg_schema: ${var.pg_schema}
              pg_database: ${var.pg_database}
          run_if: ALL_SUCCESS
          timeout_seconds: 3600
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
