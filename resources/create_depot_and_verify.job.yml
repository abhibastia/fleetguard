# Creates fleetguard_depot and proves the CDF round-trip on it — the smallest, least
# consequential table, created and verified before the other ten
# (create_remaining_tables.job.yml).
#
# Not idempotent by design, unlike its siblings: aborts with SystemExit if fleetguard_depot
# already exists, rather than a no-op. Correct for what this step proves (the CDF round-trip
# on a fresh table) — a re-run against a workspace where it already succeeded should fail
# loudly, not silently pass.
#
# The `environments` block is load-bearing: for serverless jobs the dependency list lives in
# the job, not the notebook.

resources:
  jobs:
    create_depot_and_verify:
      name: fleetguard-create-depot-and-verify
      tasks:
        - task_key: create_depot
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/06_create_depot_and_verify.py
            source: WORKSPACE
            base_parameters:
              lakebase_project: ${var.lakebase_project}
              pg_schema: ${var.pg_schema}
              pg_database: ${var.pg_database}
              catalog: ${var.catalog}
              schema: ${var.schema}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
