# Loads the recall-API integration's own state into Lakebase so the console can show it — the
# console can't read Unity Catalog at request time, so gold_recall_alert is otherwise invisible.
# Run AFTER fleetguard-poll-recalls-api, which this reads the output of.
#
# The `environments` block is load-bearing: for serverless jobs the dependency list lives in
# the job, not the notebook.

resources:
  jobs:
    load_recall_api_status:
      name: fleetguard-load-recall-api-status
      tasks:
        - task_key: load
          disabled: false
          email_notifications: {}
          environment_key: fgenv
          notebook_task:
            notebook_path: ../src/lakebase/25_load_recall_api_status.py
            source: WORKSPACE
            base_parameters:
              lakebase_project: ${var.lakebase_project}
              pg_schema: ${var.pg_schema}
              pg_database: ${var.pg_database}
              catalog: ${var.catalog}
              schema: ${var.schema}
          run_if: ALL_SUCCESS
          timeout_seconds: 3600
      email_notifications: {}
      environments:
        - environment_key: fgenv
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]
              - databricks-sdk>=0.89.0
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
