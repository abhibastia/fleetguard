# AI/BI (Lakeview) dashboard — the read-only evidence surface. Dataset/widget count drifts;
# read it from the JSON (`jq '.datasets | length' dashboards/*.lvdash.json`), not a comment.
#
# TO EDIT: change it in the UI, then re-export with
#   databricks bundle generate dashboard --resource fleetguard_overview --force --profile abhi
# (add `--watch` to keep the local file in sync). `dataset_catalog`/`dataset_schema` are set
# from bundle variables (needs CLI 0.281.0+) so the catalog/schema is stated in one place.

resources:
  dashboards:
    fleetguard_overview:
      display_name: "FleetGuard — Fleet & Recall Overview"
      # LOAD-BEARING, do not delete as redundant: without it the bundle places the dashboard
      # under its own root_path, and moving a dashboard is a recreate (new dashboard_id, new
      # permanent URL — the published one is quoted in README/STATUS). free_edition overrides
      # this per-target; its underlying CDF-sourced queries have nothing to read there, so its
      # widgets error/empty rather than show data — left in anyway since that's harmless.
      parent_path: /Users/abhisek.bastia17@gmail.com/dashboards
      file_path: ../dashboards/fleetguard_overview.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      lifecycle:
        prevent_destroy: true  # same published-URL reason as parent_path above, for deletes

      # Dashboards use a different permission vocabulary from apps/jobs: CAN_READ < CAN_RUN <
      # CAN_EDIT < CAN_MANAGE, no CAN_VIEW. CAN_RUN (not CAN_READ) because the dashboard is
      # published with embed_credentials: false, so each viewer's own identity runs the
      # queries — CAN_READ alone would render an empty page. Deliberately no base `permissions`
      # list here, same reason as fleetguard_console.app.yml: each target supplies its own ACL
      # in databricks.yml, since a target-level override on a list field appends not replaces.
