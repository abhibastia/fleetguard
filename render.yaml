# Render blueprint — FleetGuard console + API as ONE service.
#
# One service, not two: FastAPI serves /api/* and the built React console together, so there
# is no CORS. The same arrangement moves to
# Databricks Apps unchanged (E-12).
#
# Free tier spins down on inactivity; /healthz is the warm-up endpoint before any demo.
services:
  - type: web
    # Deliberately distinctive: `fleetguard` on onrender.com is already claimed by an
    # unrelated Express app, and Render silently appends a suffix when a name is taken —
    # which makes the deployed URL unpredictable and easy to confuse with someone else's.
    name: fleetguard-console-abhi
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /healthz
    # Python-only build. The console is built LOCALLY by scripts/build_console.sh and
    # committed, because Render's Python runtime does not guarantee Node — building the
    # frontend here would add a deploy-time dependency that can fail for reasons unrelated
    # to the change being deployed. Rebuild and commit the console when the frontend changes.
    buildCommand: pip install -r app/backend/requirements.txt
    # --app-dir rather than `cd`: it inserts the directory into sys.path explicitly,
    # instead of relying on uvicorn picking up the working directory.
    startCommand: uvicorn fleetguard_api.main:app --app-dir app/backend --host 0.0.0.0 --port $PORT
    envVars:
      # Required and never inferred — an unset value must not silently pick a trust model.
      #
      # LIVE since 2026-09-03: `render-u2m` — a Databricks account-admin registered the
      # custom OAuth app integration U2M needs (ENHANCEMENTS.md E-14's blocker, resolved),
      # so this service now runs real per-user Databricks OAuth (PKCE) instead of GitHub
      # app-login. The judges evaluating this project have identities in this same shared
      # bootcamp workspace, so this is the strong path for them: sign in as themselves, and
      # Unity Catalog / Postgres enforce access under their genuine token — not simulated.
      # See `auth/databricks_oauth.py` and `routers/databricks_auth_routes.py`.
      - key: FLEETGUARD_AUTH_MODE
        value: render-u2m
      # Live Lakebase, not a snapshot — render-u2m actually holds a Databricks token to back
      # it, unlike app-login. `lakebase` is also the default; set explicitly per this
      # project's "no unset value silently picks a trust model" rule.
      - key: FLEETGUARD_DATA_MODE
        value: lakebase
      - key: DATABRICKS_HOST
        value: https://dbc-7b106152-caf3.cloud.databricks.com
      - key: FLEETGUARD_PG_PROJECT
        value: projects/summer-bootcamp-2026-v2
      # Left registered but unused while FLEETGUARD_AUTH_MODE=render-u2m — auth_routes.py's
      # GitHub flow is still reachable at /api/auth/login but produces a session with no
      # access_token, which SessionTokenProvider rejects (401), so it's harmless to leave
      # configured rather than tear down. From a GitHub OAuth App (github.com → Settings →
      # Developer settings → OAuth Apps).
      #   Homepage URL:              https://fleetguard-console-abhi.onrender.com
      #   Authorization callback URL: https://fleetguard-console-abhi.onrender.com/api/auth/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Comma-separated identities allowed to APPROVE — Databricks usernames/emails now that
      # render-u2m is active (was GitHub logins under app-login). Enforced unconditionally
      # regardless of auth source (approval.py, fixed 2026-09-03): signing in grants read to
      # anyone with a valid identity in the shared workspace; dispatching work orders against
      # a fleet is restricted to this list. Empty = nobody, on any surface.
      - key: FLEETGUARD_APPROVERS
        sync: false
      # Signs the session cookie holding the user's OAuth token.
      - key: FLEETGUARD_SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"

      # --- render-u2m (live data, no Databricks Apps) ---
      #
      # `databricks_auth_routes.py` / `auth/databricks_oauth.py` implement U2M OAuth (PKCE)
      # against this same DATABRICKS_HOST. Redirect URI registered against the OAuth app
      # (must match exactly): `${FLEETGUARD_PUBLIC_URL}/api/auth/databricks/callback`.
      # DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET are set directly in the Render
      # dashboard from that registration (confidential client) — never committed.
      - key: FLEETGUARD_PUBLIC_URL
        value: https://fleetguard-console-abhi.onrender.com
      - key: DATABRICKS_CLIENT_ID
        sync: false
      - key: DATABRICKS_CLIENT_SECRET
        sync: false
