# Databricks Apps configuration — one of the two deployment surfaces for this FastAPI service
# (the other is a local server; see scripts/run_local_static_dev.sh).
#
# This file is the whole App-side cost of E-12/E-13. The auth seam already carries a
# `databricks-apps` mode (`ForwardedHeaderTokenProvider`, reading `x-forwarded-access-token`),
# so moving here needs configuration rather than code — which was the entire argument for
# building the seam on day one instead of hardcoding one provider.
#
# **The App holds no privileges of its own.** `db.py` mints its Lakebase credential from the
# *caller's* token (`WorkspaceClient(host, token=principal.token)` ->
# `postgres.generate_database_credential`), and `chat.py` calls the serving endpoint with the
# caller's token too. So the app's service principal needs no `database` or `serving-endpoint`
# resource: every read and write runs as the signed-in human, and Postgres RLS applies to them
# exactly as it does when running locally. That is why `user_authorization` below is
# load-bearing and the `resources:` block is absent.
#
# Deployed as the `app/backend/` directory, so `fleetguard_api` is importable at the root and
# no `--app-dir` is needed.

command:
  - "uvicorn"
  - "fleetguard_api.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Required and never inferred — an unset value must not silently pick a trust model.
  # `databricks-apps` selects ForwardedHeaderTokenProvider, which is only safe behind the
  # Apps ingress that injects the header. That is exactly why the mode is explicit rather
  # than sniffed from the environment. The only other accepted value is `static-dev`, for a
  # local server.
  - name: FLEETGUARD_AUTH_MODE
    value: databricks-apps
  # Live Lakebase, not the committed snapshot: this mode carries a real Databricks credential
  # per request, so there is a caller identity to run every query under.
  - name: FLEETGUARD_DATA_MODE
    value: lakebase
  - name: FLEETGUARD_PG_PROJECT
    value: projects/summer-bootcamp-2026-v2
  # db.py requires this to mint a Lakebase credential and raises without it. Apps injects a
  # host of its own, but this is set explicitly so the value is the same one the local dev
  # script uses, rather than whatever the runtime happens to supply.
  - name: DATABRICKS_HOST
    value: https://dbc-7b106152-caf3.cloud.databricks.com
  # Who may APPROVE. Read access is open to any identity that can reach the app; dispatching
  # work orders against a fleet is restricted to this list, enforced unconditionally in
  # approval.py regardless of auth source. Empty would mean nobody, on every surface.
  #
  # Comma-separated. Workspace admin does NOT bypass this — the gate is application logic, so
  # a judge with full admin rights still gets 403 on approve unless named here. Added
  # 2026-09-08 so the approval flow (the human gate in §5.3, and the most demo-relevant write
  # path) can actually be exercised rather than only described. Verified as a real, active
  # workspace identity before adding: an address that matches nobody is a silently dead entry,
  # since the check is a string comparison against the authenticated principal.
  #
  # ALL THREE JUDGES ADDED 2026-09-09 (decision A2). The approval flow is the strongest thing
  # in the demo and leaving it locked would have been a choice, not an oversight — a judge who
  # can only watch cannot exercise the human gate §5.3 is built around. Each address was
  # checked with `databricks users list --filter "userName eq ..."` before being added here and
  # came back active: sangwanrahul 8961111858221146, raghavendra.yama 8865098657037914,
  # zach 7399784953077169. The comparison is case-insensitive (`approvers()`), so the casing
  # here does not matter.
  #
  # WHAT THIS COSTS: each approval writes one service campaign plus one work order per exposed
  # vehicle — up to ~200 rows — in a single transaction, and replicates to CDF, which is
  # append-only and cannot be scrubbed afterwards. Budget cleanup after judging, and do not
  # confuse it with the app ACL: `CAN_USE` is a separate mechanism that neither grants nor
  # withholds approval.
  #
  # THIS FILE IS NOT LIVE UNTIL THE APP IS REDEPLOYED. Changing it here and stopping is the
  # same silent no-op as I-083's scope block — the running app keeps the old value.
  - name: FLEETGUARD_APPROVERS
    value: abhisek.bastia17@gmail.com,raghavendra.yama@gmail.com,sangwanrahul@icloud.com,zach@zachwilson.tech

# OBO SCOPES ARE NOT CONFIGURED HERE — do not add them back to this file.
#
# A `user_authorization: scopes:` block was tried here first and is **silently ignored**
# (I-083): the app deployed cleanly, kept only its default scopes, and every Lakebase call
# returned `403 Invalid scope, required scopes: postgres`. Nothing warns that the block had
# no effect.
#
# Scopes live on the **app resource**, not in app.yaml:
#
#   databricks apps update fleetguard-console --json '{"name":"fleetguard-console",
#     "user_api_scopes":["postgres","sql","model-serving"]}'
#
#   postgres       -> generate_database_credential + get_endpoint (all Lakebase reads/writes)
#   sql            -> SQL warehouse, for routes that query UC rather than Postgres
#   model-serving  -> POST /serving-endpoints/.../invocations from the chat panel
#
# Three things that cost real time and are invisible from the error message:
#   1. `iam.access-control:read` / `iam.current-user:read` arrive as platform defaults and
#      are REJECTED if you try to set them. List only the assignable scopes above.
#   2. **The app must be restarted after a scope change.** Granted-but-not-restarted returns
#      the identical 403 as never-granted, so the fix looks like it failed when it worked.
#   3. **Setting the scope here is not the last step — each USER must consent to it** (I-086).
#      Consent is stored per (user, app), is sticky, and does NOT widen when this list does.
#      Anyone who opened the app before the scopes were applied keeps a defaults-only grant
#      and gets the same 403 forever, through restarts and re-logins. Check and fix it with:
#
#        GET/DELETE https://<workspace>/api/2.0/oauth-app-integrations/<oauth2_app_client_id>/user-consent/me
#
#      then reopen in an INCOGNITO window — revoking does not invalidate tokens already
#      issued (~1 h), so a warm session keeps failing after a correct fix.
#
# Verify with: databricks apps get fleetguard-console -o json | grep user_api_scopes
